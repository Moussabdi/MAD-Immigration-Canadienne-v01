name: Actualiser le blogue MADIC
on:
  push:
    branches: [main]
    paths:
      - 'contenu/articles/**'
      - 'build_articles.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualiser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build_articles.py
      - name: Enregistrer le catalogue actualisé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          if ! git diff --cached --quiet; then
            git commit -m "Mettre à jour le catalogue du blogue"
            git push
          fi
