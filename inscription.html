<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Inscription | MADIC</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body data-page="signup">
    <header>
      <a href="connexion.html" class="brand"
        >MADI<span>C</span> <small>PORTAIL</small></a
      >
      <nav class="toplinks">
        <a href="connexion.html">Connexion</a
        ><a href="inscription.html">Inscription</a
        ><a href="dashboard.html">Mon espace</a>
      </nav>
    </header>
    <main>
      <section class="auth panel">
        <div class="eyebrow">MADIC</div>
        <h1>Créer un compte</h1>
        <p class="muted">
          Votre dossier sera attribué ou validé par l'administration MADIC.
        </p>
        <form id="signup">
          <label>Prénom</label
          ><input
            name="first"
            maxlength="120"
            required
            autocomplete="given-name"
          /><label>Nom</label
          ><input
            name="last"
            maxlength="120"
            required
            autocomplete="family-name"
          /><label>Courriel</label
          ><input
            name="email"
            type="email"
            required
            autocomplete="email"
          /><label>Mot de passe (12 caractères minimum recommandés)</label
          ><input
            name="password"
            type="password"
            minlength="12"
            required
            autocomplete="new-password"
          />
          <div class="actions">
            <button type="submit">Créer mon compte</button>
          </div>
        </form>
        <p id="message" class="notice" role="status"></p>
        <p class="muted">
          Déjà inscrit ? <a href="connexion.html">Connexion</a>
        </p>
      </section>
    </main>
    <footer>© MAD Immigration Canadienne · Portail client sécurisé</footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="assets/config.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
